<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - 竞赛评审管理系统</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body{background:#f1f3f7;padding-top:120px}
        .card{border-radius:14px;box-shadow:0 4px 16px rgba(0,0,0,0.08);border:none}
    </style>
</head>
<body>
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card p-5">
                <h3 class="text-center text-primary mb-4 fw-bold">竞赛评审管理系统</h3>
                <p class="text-center text-muted mb-4">请登录进入系统</p>
                <form method="post">
                    <div class="mb-3">
                        <label class="form-label">用户名</label>
                        <input name="username" class="form-control rounded-3" required placeholder="请输入用户名">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">密码</label>
                        <input name="password" type="password" class="form-control rounded-3" required placeholder="请输入密码">
                    </div>
                    <div class="mb-4">
                        <label class="form-label">选择身份</label>
                        <select name="role" class="form-select rounded-3">
                            <option value="student">👨‍🎓 学生</option>
                            <option value="judge">👩‍⚖️ 评委</option>
                            <option value="admin">⚙️ 管理员</option>
                        </select>
                    </div>
                    <button type="submit" class="btn btn-primary w-100 py-2 fw-bold">登录 / 注册</button>
                </form>
            </div>
        </div>
    </div>
</div>
</body>
</html>
