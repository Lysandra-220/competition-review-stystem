{% extends "base.html" %}
{% block content %}
<div class="card p-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h4 class="fw-bold">📜 系统操作日志</h4>
        <a href="/export_log" class="btn btn-primary">导出日志 + 备份数据库</a>
    </div>
    <div class="table-responsive">
        <table class="table table-striped table-hover">
            <thead class="table-dark">
                <tr><th>用户</th><th>IP地址</th><th>操作内容</th><th>操作时间</th></tr>
            </thead>
            <tbody>
            {% for l in logs %}
            <tr><td>{{ l[1] }}</td><td>{{ l[2] }}</td><td>{{ l[3] }}</td><td>{{ l[4] }}</td></tr>
            {% endfor %}
            </tbody>
        </table>
    </div>
</div>
{% endblock %}
