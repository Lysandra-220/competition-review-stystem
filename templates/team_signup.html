{% extends "base.html" %}
{% block content %}
<div class="card p-5">
    <h4 class="fw-bold mb-4">📝 团队报名</h4>
    <form method="post">
        <div class="mb-3">
            <label class="form-label">队伍名称</label>
            <input name="team_name" class="form-control rounded-3" required placeholder="输入队伍名称">
        </div>
        <div class="mb-3">
            <label class="form-label">组员2</label>
            <input name="member2" class="form-control rounded-3" placeholder="组员姓名">
        </div>
        <div class="mb-3">
            <label class="form-label">组员3</label>
            <input name="member3" class="form-control rounded-3" placeholder="组员姓名">
        </div>
        <div class="mb-3">
            <label class="form-label">参赛组别</label>
            <select name="group_type" class="form-select rounded-3">
                <option>本科生组</option>
                <option>研究生组</option>
            </select>
        </div>
        <div class="mb-4">
            <label class="form-label">作品上传截止日期</label>
            <input name="upload_deadline" type="date" class="form-control rounded-3">
        </div>
        <button class="btn btn-success">提交报名</button>
    </form>
</div>
{% endblock %}
